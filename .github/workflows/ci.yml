# CI for INTRANET ZERO (master prompt §17.5). The same commands are run
# locally on every change; this file mirrors them exactly.

name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: Compile the public tutorial world
        run: pnpm run worlds:build
      - run: pnpm test
      - name: Headless tutorial playthrough + determinism (M0 gate)
        run: pnpm run test:integration

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Private content must never be tracked
        run: |
          for f in "INTRANET_ZERO_GLM_MASTER_PROMPT.md" "INTRANET ZERO Product and Engineering Spec.md"; do
            if git ls-files --error-unmatch "$f" 2>/dev/null; then
              echo "::error::$f is tracked in git — it contains private content"
              exit 1
            fi
            if [ -f "$f" ] && ! git check-ignore -q "$f"; then
              echo "::error::$f exists but is not git-ignored"
              exit 1
            fi
          done
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm audit --prod --audit-level high
