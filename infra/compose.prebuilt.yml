# Compose override for machines where docker compose cannot resolve the
# build context (observed with docker compose v5.2 on Windows when the repo
# path contains a space). Build first, then:
#   docker build -f infra/Dockerfile -t iz-app .
#   docker compose -f infra/docker-compose.yml -f infra/compose.prebuilt.yml up
services:
  app:
    build: !reset null
    image: iz-app
