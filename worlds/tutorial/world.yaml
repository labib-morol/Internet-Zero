# Lost and Found — the public tutorial world for INTRANET ZERO (master prompt, Appendix B).
# Premise: the departed intern rotated the printer admin passphrase and left only a hint.
id: tutorial
version: 1.0.0
format: iz/1
title: "Lost and Found"
summary: "An intern lost the office printer password. Find it."
license: CC-BY-4.0
hostSuffix: pcp
clock:
  mode: session
  epoch: "2026-11-02T09:00:00Z"
hosts:
  - { host: forge.pinecone.pcp, service: forge, title: "GIT//FORGE" }
  - { host: mail.pinecone.pcp, service: mail, title: "DEADLETTER", requires: { gateSolved: g.first-commit } }
  - { host: printer.pinecone.pcp, service: terminal, title: "NODE TERMINAL", requires: { gateSolved: g.mailbox } }
entry: "forge.pinecone.pcp/pinecone/office-scripts"
reports: [r.who-holds]
